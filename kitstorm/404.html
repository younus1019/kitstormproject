<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | Page Not Found | KitStorm</title>

  <meta
    name="description"
    content="The page you're looking for could not be found. Return to KitStorm or explore our custom teamwear and sports apparel."
  >

  <link rel="icon" type="image/png" href="images/logo img.png">
  <link rel="stylesheet" href="404.css">

</head>


<body>


  <!-- =====================================================
       PAGE CONTROLS
       ===================================================== -->

  <div class="page-controls">

    <button
      class="control-btn"
      id="rtlToggle"
      type="button"
      aria-label="Toggle text direction"
    >
      <i data-lucide="align-right"></i>
    </button>


    <button
      class="control-btn"
      id="darkToggle"
      type="button"
      aria-label="Toggle dark mode"
    >
      <i data-lucide="moon"></i>
    </button>

  </div>



  <!-- =====================================================
       404 ERROR PAGE
       ===================================================== -->

  <section class="error-page">


    <div class="error-content">


      <!-- ERROR ICON -->

      <div class="error-icon">

        <i data-lucide="shirt"></i>

      </div>


      <!-- ERROR NUMBER -->

      <div class="error-number">
        404
      </div>


      <!-- ERROR TITLE -->

      <h1 class="error-title">

        Page Not
        <span>Found</span>

      </h1>


      <!-- DESCRIPTION -->

      <p class="error-description">

        The page you're looking for doesn't exist or may have been moved.
        Let's get you back to the right place and back to your teamwear journey.

      </p>


      <!-- ACTION BUTTONS -->

      <div class="error-actions">


        <a
          href="index.html"
          class="btn btn-primary"
        >

          <i data-lucide="house"></i>

          <span>
            Go to Home
          </span>

        </a>


        <a
          href="products.html"
          class="btn btn-secondary"
        >

          <span>
            Explore Teamwear
          </span>

          <i data-lucide="arrow-up-right"></i>

        </a>


      </div>


      <!-- HELP -->

      <div class="error-help">

        <span></span>

        <p>

          Need help?

          <a href="contact.html">
            Contact KitStorm
          </a>

        </p>

        <span></span>

      </div>


    </div>


    <!-- =================================================
         KITSTORM SPORTS DECORATION
         ================================================= -->

    <div
      class="error-decoration"
      aria-hidden="true"
    >

      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </div>


  </section>



  <!-- =====================================================
       SCRIPTS
       ===================================================== -->

  <script src="https://unpkg.com/lucide@0.542.0/dist/umd/lucide.min.js"></script>

  <script src="404.js"></script>


</body>

</html>
